<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Finish · No Points & Generic Surveys — Ipsos iSay</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="../assets/styles.css" rel="stylesheet">
</head>
<body>
<div id="screen"></div>

<template id="screen-content">
  <div class="stage pt-5">
    <h3 class="d-flex align-items-center gap-3 mb-4"><img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/survey/icon-check-blue.svg" alt="" aria-hidden="true"> Thank you for taking this survey</h3>

    <div class="row align-items-center g-3 mb-4">
      <div class="col-12 col-md-8">
        <h4 class="mb-1">More <em class="text-primary fst-normal">surveys</em> are ready for you</h4>
        <p class="mb-0">Get matched with the best survey for your profile and earn up to __STAR__ <strong>200 points</strong></p>
      </div>
      <div class="col-12 col-md-4 text-md-end">
        <a class="btn btn-primary" href="#">Start Survey</a>
      </div>
    </div>

    <div class="mb-4">__POINTS__</div>
    <div class="text-center"><a class="btn btn-gray" href="#">Go to Dashboard</a></div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/partials.js"></script>
<script>
  const t = document.getElementById('screen-content');
  t.innerHTML = t.innerHTML
    .replace('__CHECK_BLUE__', ICON.checkBlue)
    .replace(/__STAR__/g, ICON.star)
    .replace('__POINTS__', pointsCard());
  mountScreen({ balance: false, user: true });
</script>
</body>
</html>
