<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Warning Message — Ipsos iSay</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="../assets/styles.css" rel="stylesheet">
</head>
<body>
<div id="screen"></div>

<template id="screen-content">
  <div class="stage pt-5">
    <div class="panel-default p-4">
      <div class="row g-4 align-items-start">
        <div class="col-12 col-md-auto text-center">
          <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/survey/icon-warning.webp" alt="" aria-hidden="true">
        </div>
        <div class="col">
          <h4 class="mb-3">Thanks for taking this survey!</h4>
          <div class="alert alert-warning mb-0">
            <div class="fw-bold d-flex align-items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> Heads up</div>
            <p class="fw-bold mt-2 mb-1 text-warning-plus-2">We noticed your responses seemed a bit rushed or inconsistent.</p>
            <p class="mb-0 text-warning-plus-2">To avoid account deactivation and losing your points, please ensure your behavior meets our <a href="#">standards and requirements</a>.</p>
          </div>
          <div class="mt-3">
            <div class="text-muted">You earned:</div>
            <div class="d-flex align-items-center gap-2 fs-4 fw-bold text-main">__STAR_BIG__ 70 points</div>
          </div>
        </div>
      </div>
    </div>
    <div class="text-center mt-4"><a class="btn btn-gray" href="#">Go to Dashboard</a></div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/partials.js"></script>
<script>
  const t = document.getElementById('screen-content');
  t.innerHTML = t.innerHTML.replace('__STAR_BIG__', ICON.star);
  mountScreen({ balance: false, user: true });
</script>
</body>
</html>
