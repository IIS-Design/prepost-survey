<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not the Right Fit · No Points & Profiling — Ipsos iSay</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link href="../assets/styles.css" rel="stylesheet">
</head>
<body>
<div id="screen"></div>

<template id="screen-content">
  <div class="stage pt-5 pt-md-0">
    <h3 class="d-flex align-items-center gap-3 mb-4"> <img src="https://cdn.ipsosinteractive.com/deploy/PanelOne/resources/images/revamp/survey/icon-xmark.svg" alt="" aria-hidden="true"> This survey wasn't the right fit.</h3>
    <div class="alert alert-primary text-center text-main mb-4">You earned __STAR__ <strong>3 points!</strong></div>
    <p class="mb-4">Help us find better survey matches for you. The more you tell us about yourself, the easier it is to connect you with surveys you'll qualify for.</p>

    <div class="text-center mb-4">
      <a class="btn btn-secondary" href="#">Complete Your Profile</a>
      <p class="small mx-auto mt-3 mb-0" style="max-width:430px">We'd like to know you better! Completing your profile helps us match you with rewarding surveys that best fit your interests and lifestyle.</p>
    </div>

    <div class="text-center"><a class="btn btn-gray" href="#">Go to Dashboard</a></div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/partials.js"></script>
<script>
  const t = document.getElementById('screen-content');
  t.innerHTML = t.innerHTML.replace(/__STAR__/g, ICON.star);
  mountScreen({ balance: true, user: true });
</script>
</body>
</html>
